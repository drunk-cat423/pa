5" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M1320 905 H1420" fill="none" stroke="#557695" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M780 1050 H660 V670 H520" fill="none" stroke="#3c9275" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M530 1300 H625" fill="none" stroke="#8773b3" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M1075 1300 H1165" fill="none" stroke="#8773b3" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M525 220 H1515 V1170 H310 V1250" fill="none" stroke="#8773b3" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="300" y="43" text-anchor="middle" font-size="28" fill="#17324d">PA：从消息到回答，再到长期记忆</text><rect x="75" y="87.5" width="450" height="65" rx="16" fill="#deedff" stroke="#7597bd" stroke-width="2"/><text x="300" y="127" text-anchor="middle" font-size="20" fill="#17324d">QQ 群聊 / 私聊消息</text><rect x="75" y="177.5" width="450" height="85" rx="16" fill="#fff" stroke="#7597bd" stroke-width="2"/><text x="300" y="213" text-anchor="middle" font-size="20" fill="#17324d">白名单、真实身份、事件去重</text><text x="300" y="241" text-anchor="middle" font-size="20" fill="#17324d">保存原文与发言者 ID</text><polygon points="300,277 414,335 300,393 186,335" fill="#fff0cf" stroke="#d69b3b" stroke-width="2"/><text x="300" y="328" text-anchor="middle" font-size="20" fill="#17324d">允许的私聊</text><text x="300" y="356" text-anchor="middle" font-size="20" fill="#17324d">或群内真实 @？</text><rect x="835" y="302.5" width="430" height="65" rx="16" fill="#f0f2f5" stroke="#7597bd" stroke-width="2"/><text x="1050" y="342" text-anchor="middle" font-size="20" fill="#17324d">未 @：仅保存观察，不回答</text><rect x="65" y="415" width="470" height="140" rx="16" fill="#deedff" stroke="#7597bd" stroke-width="2"/><text x="300" y="450" text-anchor="middle" font-size="20" fill="#17324d">独立任务：并发 2，组装上下文</text><text x="300" y="478" text-anchor="middle" font-size="20" fill="#17324d">AI 与人物：已归档 + 未归档</text><text x="300" y="506" text-anchor="middle" font-size="20" fill="#17324d">群聊：本人最近一轮 + 当前消息</text><text x="300" y="534" text-anchor="middle" font-size="20" fill="#17324d">私聊：续聊摘要 + 未整理历史</text><rect x="80" y="620" width="440" height="100" rx="16" fill="#dff4ed" stroke="#589f87" stroke-width="2"/><text x="300" y="663" text-anchor="middle" font-size="20" fill="#17324d">Pi 调用 LLM，自主决定下一步</text><text x="300" y="691" text-anchor="middle" font-size="20" fill="#17324d">默认自然简短 / 专业模式严谨分析</text><polygon points="300,767 414,825 300,883 186,825" fill="#fff0cf" stroke="#d69b3b" stroke-width="2"/><text x="300" y="818" text-anchor="middle" font-size="20" fill="#17324d">模型是否</text><text x="300" y="846" text-anchor="middle" font-size="20" fill="#17324d">调用工具？</text><rect x="80" y="925" width="440" height="80" rx="16" fill="#fff" stroke="#7597bd" stroke-width="2"/><text x="300" y="958" text-anchor="middle" font-size="20" fill="#17324d">保存最终答案与运行关联</text><text x="300" y="986" text-anchor="middle" font-size="20" fill="#17324d">专业答案直接输出，不再次润色</text><rect x="80" y="1045" width="440" height="90" rx="16" fill="#deedff" stroke="#7597bd" stroke-width="2"/><text x="300" y="1069" text-anchor="middle" font-size="20" fill="#17324d">同群整条排队发送，记录回执</text><text x="300" y="1097" text-anchor="middle" font-size="20" fill="#17324d">超窗 / 超槽 → 主动发送</text><text x="300" y="1125" text-anchor="middle" font-size="20" fill="#17324d">未知不重发；/result 领取结果</text><rect x="705" y="70" width="690" height="140" rx="16" fill="#fff0cf" stroke="#d69b3b" stroke-width="2"/><text x="1050" y="105" text-anchor="middle" font-size="20" fill="#17324d">每次提问：最多 6 次模型 + 8 次工具</text><text x="1050" y="133" text-anchor="middle" font-size="20" fill="#17324d">最后一次模型调用关闭工具，依据已有证据收尾</text><text x="1050" y="161" text-anchor="middle" font-size="20" fill="#17324d">不设整次总时限；各模型和网络请求单独超时</text><text x="1050" y="189" text-anchor="middle" font-size="20" fill="#17324d">单请求超时或取消：中止请求，保留已提交操作</text><text x="1050" y="427" text-anchor="middle" font-size="21" fill="#17324d">程序校验身份与参数；不匹配语义前缀</text><rect x="780" y="455" width="540" height="90" rx="16" fill="#e5e6ff" stroke="#9190c4" stroke-width="2"/><text x="1050" y="493" text-anchor="middle" font-size="20" fill="#17324d">update_profile · 更新画像</text><text x="1050" y="521" text-anchor="middle" font-size="20" fill="#17324d">绑定当前真人来源 → 原文摘录 → 未归档</text><rect x="780" y="590" width="540" height="90" rx="16" fill="#e5e6ff" stroke="#9190c4" stroke-width="2"/><text x="1050" y="614" text-anchor="middle" font-size="20" fill="#17324d">read_history · 读取历史</text><text x="1050" y="642" text-anchor="middle" font-size="20" fill="#17324d">中文分词 + SQLite FTS5/BM25</text><text x="1050" y="670" text-anchor="middle" font-size="20" fill="#17324d">先过滤房间/人物，再返回最多 10 条</text><rect x="780" y="725" width="540" height="90" rx="16" fill="#e5e6ff" stroke="#9190c4" stroke-width="2"/><text x="1050" y="763" text-anchor="middle" font-size="20" fill="#17324d">web_search / web_fetch · 公开资料</text><text x="1050" y="791" text-anchor="middle" font-size="20" fill="#17324d">配置允许时提供；返回真实来源</text><rect x="780" y="860" width="540" height="90" rx="16" fill="#e5e6ff" stroke="#9190c4" stroke-width="2"/><text x="1050" y="884" text-anchor="middle" font-size="20" fill="#17324d">answer_in_depth · 深入回答</text><text x="1050" y="912" text-anchor="middle" font-size="20" fill="#17324d">持久化并发送短提示 → 切换专业提示</text><text x="1050" y="940" text-anchor="middle" font-size="20" fill="#17324d">继承证据和预算；禁重复切换及画像写入</text><rect x="780" y="1017.5" width="540" height="65" rx="16" fill="#dff4ed" stroke="#589f87" stroke-width="2"/><text x="1050" y="1057" text-anchor="middle" font-size="20" fill="#17324d">工具结果回到 Pi，继续循环</text><text x="645" y="320" text-anchor="middle" font-size="17" fill="#557695">否</text><text x="333" y="406" text-anchor="middle" font-size="17" fill="#557695">是</text><text x="335" y="911" text-anchor="middle" font-size="17" fill="#557695">否</text><text x="636" y="809" text-anchor="middle" font-size="17" fill="#557695">是，调用工具</text><text x="662" y="1100" text-anchor="middle" font-size="17" fill="#3c9275">剩余预算内继续 / 最后一轮收尾</text><text x="800" y="1220" text-anchor="middle" font-size="24" fill="#5d4f8c">独立后台记忆：不阻塞正常聊天</text><rect x="90" y="1250" width="440" height="100" rx="16" fill="#fff" stroke="#a998ca" stroke-width="2"/><text x="310" y="1279" text-anchor="middle" font-size="20" fill="#17324d">群 50 条 / 私聊 50 轮</text><text x="310" y="1307" text-anchor="middle" font-size="20" fill="#17324d">或最终上下文达到 85%</text><text x="310" y="1335" text-anchor="middle" font-size="20" fill="#17324d">捕获固定消息与画像快照</text><rect x="625" y="1250" width="450" height="100" rx="16" fill="#fff" stroke="#a998ca" stroke-width="2"/><text x="850" y="1279" text-anchor="middle" font-size="20" fill="#17324d">整理画像、话题、私聊续聊摘要</text><text x="850" y="1307" text-anchor="middle" font-size="20" fill="#17324d">校验来源与版本 → 原子提交</text><text x="850" y="1335" text-anchor="middle" font-size="20" fill="#17324d">只归档本次实际处理的补充</text><rect x="1165" y="1250" width="330" height="100" rx="16" fill="#fff" stroke="#a998ca" stroke-width="2"/><text x="1330" y="1279" text-anchor="middle" font-size="20" fill="#17324d">在途新增继续未归档</text><text x="1330" y="1307" text-anchor="middle" font-size="20" fill="#17324d">原文和修订保留</text><text x="1330" y="1335" text-anchor="middle" font-size="20" fill="#17324d">下轮注入更新画像</text><text x="1160" y="1157" text-anchor="middle" font-size="17" fill="#8773b3">原文和独立批次进入后台</text><text x="800" y="1405" text-anchor="middle" font-size="17" fill="#6e6480">显式管理命令保留本地鉴权；画像不按饮食、兴趣等字段分类；图片/语音尚未接入</text></g></svg>